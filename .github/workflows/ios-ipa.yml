# Builds the iPhone/iPad app on the project's own Mac (an Apple Silicon M1 registered as a
# self-hosted runner with the label makera-z1-pendant-macos) and attaches it to the release as an unsigned .ipa,
# so people without a Mac can install it from Windows with Sideloadly or AltStore (they sign it
# with their own Apple ID; see "iPhone without a Mac" in the README).
#
# Runs by itself when a release is published. To add the .ipa to an existing release:
#   gh workflow run ios-ipa.yml -f tag=v0.1.8
#
# This workflow never runs for a pull request. A fork's pull request could still bring its own
# workflow aimed at this runner's labels, so the repository requires approval before any external
# contributor's workflows run (Settings > Actions > General). The runner runs as a macOS user of
# its own, with Xcode, the GitHub CLI (brew install gh) and zip on its PATH, and the Mac stays
# awake on AC power (sudo pmset -c sleep 0), or the job queues.
name: iPhone app (.ipa)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the .ipa to (e.g. v0.1.8)
        required: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: [self-hosted, macOS, ARM64, makera-z1-pendant-macos]
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # A Gradle home of its own on the Mac: the heap setting below and the caches stay out of
      # other Gradle builds of the runner's user, and persist between runs.
      GRADLE_USER_HOME: ${{ github.workspace }}/../.gradle-makera-z1-pendant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build (unsigned)
        working-directory: ios
        run: |
          # Kotlin/Native's release link needs more heap than the project's 3 GB.
          mkdir -p "$GRADLE_USER_HOME"
          echo "org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" > "$GRADLE_USER_HOME/gradle.properties"
          xcodebuild -version
          xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          V="${TAG#v}"
          APP="ios/build/Release-iphoneos/Z1 Pendant.app"
          test -d "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../z1-pendant-$V.ipa" Payload)
          ls -l "z1-pendant-$V.ipa"
          echo "IPA=z1-pendant-$V.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$IPA" --clobber
